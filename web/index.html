<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>스타빌드 이슈레이더</title>
  <meta name="description" content="블로그 소재가 될 경제·부동산 이슈를 모아 보여줍니다.">
  <meta name="theme-color" content="#14213d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar__left">
      <h1 class="appbar__title">이슈레이더</h1>
      <div class="appbar__status" id="status-line">불러오는 중…</div>
    </div>
    <div class="appbar__actions">
      <button type="button" class="iconbtn" id="btn-refresh" aria-label="새로고침">↻</button>
      <button type="button" class="iconbtn" id="btn-saved" aria-label="저장한 소재">저장 <span id="saved-count" class="count">0</span></button>
      <button type="button" class="iconbtn" id="btn-settings" aria-label="설정">설정</button>
    </div>
  </header>

  <div id="banners" aria-live="polite"></div>

  <div class="toolbar" id="toolbar">
    <input id="search" type="search" placeholder="검색" autocomplete="off" aria-label="검색 (키워드·지역·제목)">
    <select id="region" aria-label="지역으로 거르기"><option value="">전체 지역</option></select>
    <button type="button" class="sortbtn" id="sort" aria-label="정렬 바꾸기">점수순</button>
  </div>

  <main id="main" tabindex="-1"><p class="empty">불러오는 중…</p></main>

  <nav class="tabbar" id="tabbar" aria-label="분야">
    <button type="button" data-tab="today" class="on" aria-label="오늘 추천"><span>오늘</span><span>추천</span></button>
    <button type="button" data-tab="증시·경제" aria-label="증시·경제"><span>증시</span><span>경제</span></button>
    <button type="button" data-tab="금리·대출" aria-label="금리·대출"><span>금리</span><span>대출</span></button>
    <button type="button" data-tab="숙박·관광" aria-label="숙박·관광"><span>숙박</span><span>관광</span></button>
    <button type="button" data-tab="부동산·상권" aria-label="부동산·상권"><span>부동산</span><span>상권</span></button>
    <button type="button" data-tab="지역개발" aria-label="지역개발"><span>지역</span><span>개발</span></button>
  </nav>

  <!-- 소재 패킷 / 저장함 / 설정 화면 (전체 화면으로 덮음) -->
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title">
    <div class="sheet__head">
      <button type="button" class="iconbtn" id="sheet-close">닫기</button>
      <h2 id="sheet-title" class="sheet__title"></h2>
    </div>
    <div class="sheet__body" id="sheet-body"></div>
    <div class="sheet__actions" id="sheet-actions" hidden></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
