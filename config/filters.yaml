# ─────────────────────────────────────────────
# 걸러내기 설정 — 해외 기사 제외, 광고성 기사 감점 (대표님이 수정 가능)
# ─────────────────────────────────────────────

# 해외 매체 주소 — 기사 주소에 이 글자가 들어 있으면 무조건 제외
# (예전 시제품에서 Vietnam.vn 한국어판 기사가 1위로 올라온 문제 방지)
foreign_domains:
  - vietnam.vn
  - vietnamplus.vn
  - vnanet.vn
  - nhandan.vn
  - kr.people.com.cn
  - korean.cri.cn
  - kr.xinhuanet.com
  - chinadaily.com.cn
  - japanese.joins.com   # 국내 매체의 일본어판

# 해외 국가 도메인 끝자리 — 주소가 이렇게 끝나면 제외
foreign_tlds: [.vn, .cn, .jp, .th, .id, .ph, .my, .kh, .la, .mn]

# 해외 언론사 이름 (Google News 는 언론사 이름으로 판단)
foreign_sources:
  - Vietnam.vn
  - Laodong.vn       # 2026-10-26 실제 수집에서 14건 섞여 들어옴
  - VietnamPlus
  - 인민망
  - CRI
  - 신화망
  - 베트남통신

# 해외 지명·지수 — 제목에 있으면 제외.
# 단, 아래 domestic_anchors(국내 연관 단어)가 같이 있으면 남깁니다.
# 예) "베트남 부동산 급등" → 제외 / "베트남 관광객 방한 급증" → 남김(숙박 수요와 연결)
foreign_words:
  - 베트남
  - 하노이
  - 호찌민
  - 호치민
  - 다낭
  - 나트랑
  - 캄보디아
  - 라오스
  - 태국
  - 방콕
  - 필리핀
  - 인도네시아
  - 말레이시아
  - 몽골
  - VN지수
  - VN-Index
  - 항셍
  - 상하이종합

domestic_anchors:
  - 방한
  - 국내
  - 한국
  - 서울
  - 부산
  - 제주
  - 인천
  - 코스피
  - 코스닥
  - 관광객

# 제목에 한글이 한 글자도 없으면 제외 (해외 기사가 국내 검색에 섞이는 경우 — 실제로 'Calgary Roughnecks' 기사가 섞여 나옴)
require_hangul_title: true

# 해외 지명 (사업형 분야만) — 교통·개발·숙박 같은 사업형 이슈인데 제목에 이 말이 있고
# 국내 지역 태그·국내 연관 단어가 하나도 없으면 제외. (증시·경제 같은 집객형은 미국·중국 소식도 필요해서 적용 안 함)
# 2026-10-26 실제 데이터: '호주 시드니 신공항 개항'이 개통 가산점으로 상위에 올라옴
foreign_words_business:
  - 미국
  - 중국
  - 일본
  - 호주
  - 시드니
  - 도쿄
  - 오사카
  - 베이징
  - 상하이
  - 뉴욕
  - 런던
  - 영국
  - 프랑스
  - 독일
  - 싱가포르
  - 홍콩
  - 대만
  - 두바이
  - 사우디
  - 캐나다
  - 유럽
  - 美
  # ※ '인도'(보도·인도 설치), '中'(中企=중소기업)은 일반 단어와 겹쳐서 넣지 않았습니다

# 위 해외 지명이 있어도 이 말이 있으면 남김 — 외국 기업의 국내 투자 유치는 중요한 소재
# (예: '경기경제청, 유럽 첨단기업 투자유치')
foreign_business_keep: [유치, 국내 진출, 한국 진출, 국내]

# 인물·인사 기사 — 제외하지 않고 감점 (블로그 소재로 약함). scoring.yaml 의 people_penalty
people_words:
  - "[프로필]"
  - "[인사]"
  - "(인사)"
  - 오늘의 인사
  - "[부고]"
  - 부고
  - 별세
  - "[동정]"
  - 부총재보
  - 임명
  - 선임
  - 취임
  - 내정

# 기사가 아닌 페이지 제외 — 지자체 사이트 검색에 섞이는 메뉴·목록·채용 페이지 (제목에 있으면 제외)
junk_titles:
  - 상세보기
  - 고시/공고 조회
  - 통합게시판
  - 새소식 -
  - 서울소식 |
  - 버스정보
  - 채용
  - 모집 공고
  - 공개채용
  - 계약정보
  - 수의계약
  - 누리집 |
  - 홈페이지 만족도

# 지자체 사이트 결과에만 추가로 적용 — 2026-10-26 실제 수집에서 충남도청 결과의 절반 가까이가 채용·입찰 공고였음
junk_titles_local_gov:
  - 공고
  - 입찰
  - 용역
  - 합격자
  - 기간제
  - 근로계약
  - 수의견적
  - 보도자료 >
  - 의회소식
  - " > "

# 분야 분류·연결 규칙에서 무시하는 낱말 — 키워드가 다른 단어 안에 들어 있어 잘못 걸리는 경우
# 예) '전세계'의 전세, '공매도'의 공매, '유가족·유가증권'의 유가, '연장선상'의 연장선
classify_ignore:
  - 전세계
  - 전세기
  - 공매도
  - 유가족
  - 유가증권
  - 연장선상
  - 트램펄린
  - 성수기
  - 전환율          # '전·월세 전환율'의 환율

# 보장성 표현 — 상담 안내 문구·연결 문장·소재 패킷에 쓰면 안 되는 말
# 설정 검사기가 bridges.yaml 에서 발견하면 경고합니다. 띄어쓰기는 무시하고 찾습니다("대출가능"도 잡음).
# (블로그 카테고리 이름 '대출 가능·불가 판단' 자체는 카테고리 이름이라 검사에서 뺍니다)
guarantee_phrases:
  - 대출 가능
  - 대출 100%
  - 무조건 대출
  - 무조건 승인
  - 승인 보장
  - 100% 승인
  - 수익 보장
  - 수익률 보장
  - 고수익 보장
  - 원금 보장
  - 확정 수익
  - 확실한 수익
  - 손실 없는
  - 최저 금리 보장
  - 무조건 오른다
  - 반드시 오릅니다

# 공포 조장 표현 — 악재 이슈라도 쓰지 않고 '확인할 것' 중심으로 씁니다 (설정 검사기가 경고)
fear_phrases:
  - 폭락 공포
  - 공포
  - 패닉
  - 붕괴
  - 초토화
  - 날벼락
  - 직격탄
  - 쪽박
  - 망한다
  - 끝났다
  - 지금 안 팔면
  - 큰일 납니다

# 광고성·홍보성 기사 — 제외하지 않고 점수만 깎습니다 (scoring.yaml 에서 감점 크기 조절)
ad_words_strong:   # 거의 확실한 광고 → 크게 감점
  - "[광고]"
  - "[AD]"
  - 협찬
  - 체험단
  - 선착순
  - 무료 상담
  - 경품
ad_words_soft:     # 홍보일 가능성 → 조금 감점
  - 분양 중
  - 견본주택
  - 모델하우스 오픈
  - 그랜드 오픈
  - 이벤트
  - 할인 행사
  - 프로모션
  - 출시 기념
  - 특가
