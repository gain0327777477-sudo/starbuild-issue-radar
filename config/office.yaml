# ─────────────────────────────────────────────
# 사무소 정보 — 대표님이 직접 입력하는 파일
#
# ★ 주소·등록번호·연락처는 이 파일 한 곳에서만 관리합니다.
#   다른 설정 파일이나 프로그램 안에는 적지 않습니다. 사무소를 옮기면 이 파일만 고치면 됩니다.
#   (설정 검사기가 다른 파일에 전화번호·등록번호가 적혀 있으면 경고합니다)
#
# 블로그 소재 패킷 맨 아래 '상담 안내 문구'에 들어갑니다.
# 따옴표("") 안에 입력하세요. 비워두면 그 줄은 안내 문구에서 빠집니다.
# ※ 이 저장소는 공개 저장소입니다. 블로그에 이미 공개하는 정보만 넣으세요.
# ─────────────────────────────────────────────

name: ""                 # 상호 (예: 스타빌드공인중개사사무소)
short_name: "스타빌드"    # 줄인 이름 — 상담 안내 첫 문장("전국 모텔·호텔 매매 전문 스타빌드입니다")에 사용
representative: ""       # 대표자 이름
registration_no: ""      # 중개사무소 등록번호 (이전하면 바뀔 수 있음)
address: ""              # 소재지(주소) — 사무소 이전 시 여기만 수정
phone: ""                # 대표 전화
mobile: ""               # 휴대폰 (문자·상담용)
kakao: ""                # 카카오톡 오픈채팅 주소 또는 아이디 (없으면 비워두기)

# 내 블로그 주소 — 블로그 RSS 주소(최근 글 중복 확인용)도 여기서 자동으로 만듭니다
