# ─────────────────────────────────────────────
# 대기업 + 투자 조합 검색 — '삼성 착공', 'SK 증설' 처럼 회사 이름과 동작 단어를 조합해 검색
#  companies × actions 개수만큼 네이버 검색이 늘어납니다 (지금 10곳 × 3개 = 30회/30분)
#  기사 분류: 제목·요약에 회사 이름과 동작 단어가 함께 있으면 '대기업·기업 투자' 분야로 분류
# ─────────────────────────────────────────────
company_combos:
  field: corp
  companies:          # 대기업 목록 — 같은 회사 다른 이름은 | 로
    - 삼성|삼성전자|삼성SDI|삼성바이오로직스|삼성물산
    - SK|SK하이닉스|SK온|SK이노베이션
    - 현대차|현대자동차|현대차그룹|기아|현대모비스
    - LG|LG에너지솔루션|LG전자|LG화학
    - 롯데|롯데그룹
    - 한화|한화그룹|한화에어로스페이스
    - 포스코|POSCO|포스코퓨처엠
    - CJ|CJ그룹
    - 신세계|스타필드|이마트
    - GS|GS건설
  actions:            # 맨 앞 단어로 검색, 나머지는 분류에 사용
    - 공장 투자|투자협약|투자 계획|투자
    - 착공|기공식
    - 증설|신설|공장 건설

# ─────────────────────────────────────────────
# 이름이 바뀐 기관 — 새 이름|옛 이름|줄임말
#  · 정책브리핑 검색: sources.yaml 의 부처 이름이 여기 있으면 옛 이름까지 OR 로 묶어 검색
#  · 기사 분류·묶기: '기재부' 기사와 '재정경제부' 기사를 같은 기관으로 보고 같은 사건으로 묶음
#  ※ 기획재정부는 재정경제부·기획예산처 두 곳으로 나뉘어 양쪽에 모두 옛 이름으로 넣었습니다.
# ─────────────────────────────────────────────
agencies:
  - 재정경제부|기획재정부|기재부|재경부
