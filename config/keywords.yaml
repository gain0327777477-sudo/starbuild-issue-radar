# ─────────────────────────────────────────────
# 이슈 분야와 검색 키워드 — 대표님이 수정 가능
#
# 고치는 법
#  - 키워드 추가: keywords 목록에 "- 새키워드" 한 줄 추가
#  - 같은 뜻 묶기: "리츠|REITs" 처럼 | 로 구분
#      → 맨 앞 단어(리츠)로 네이버에서 검색하고, 뒤 단어들은 기사 분류에만 사용
#  - 키워드 하나 = 네이버 검색 1회(30분마다). 너무 많이 늘리면 하루 한도에 가까워집니다.
#    (python -m collector.check_config 를 실행하면 예상 호출 수를 보여줍니다)
#
# 항목 설명
#  name : 화면에 보이는 분야 이름(배지)
#  group: 집객형(검색량 많음, 반드시 사업 연결 문장과 함께) / 사업형(문의로 직결)
#  tab  : 화면 상단 탭 — 증시·경제 / 금리·대출 / 숙박·관광 / 부동산·상권 / 지역개발
#  ※ 맨 앞의 영문 이름(stock, macro …)은 프로그램이 쓰는 이름이라 바꾸지 마세요.
# ─────────────────────────────────────────────

fields:
  # ── 집객형 ─────────────────────────────
  stock:
    name: 증시·주식
    group: 집객형
    tab: 증시·경제
    keywords:
      - 코스피
      - 코스닥
      - 미국 증시|뉴욕증시|미 증시
      - 나스닥
      - 외국인 매매|외국인 순매수|외국인 순매도
      - 반도체주
      - 건설주
      - 리츠|REITs
      - 배당|배당주

  macro:
    name: 거시경제
    group: 집객형
    tab: 증시·경제
    keywords:
      - 환율|원달러|원·달러
      - 물가|소비자물가
      - 연준|FOMC|파월
      - 유가|국제유가
      - 경기 침체|경기침체
      - 수출

  asset:
    name: 자산 흐름
    group: 집객형
    tab: 증시·경제
    keywords:
      - 금값|금 시세
      - 예금 금리|예금금리|정기예금
      - 머니무브|자금 이동

  # ── 사업형 ─────────────────────────────
  rate:
    name: 금리·대출
    group: 사업형
    tab: 금리·대출
    keywords:
      - 기준금리
      - 한국은행|한은
      - 주담대|주택담보대출
      - DSR
      - 가계대출
      - 사업자대출|개인사업자 대출
      - 대출 규제|대출규제

  lodging:
    name: 숙박·관광
    group: 사업형
    tab: 숙박·관광
    keywords:
      - 모텔
      - 호텔
      - 숙박업
      - 공중위생관리법
      - 관광객
      - 외국인 관광객|방한 관광객|방한객
      - 숙박수요|숙박 수요
      - 관광특구
      - 지역축제

  commercial:
    name: 수익형·상업용
    group: 사업형
    tab: 부동산·상권
    keywords:
      - 상가
      - 꼬마빌딩
      - 건물 매매|빌딩 매매
      - 수익형 부동산
      - 공실률|공실
      - 상권 활성화
      - 골목상권

  policy:
    name: 부동산 정책·세금
    group: 사업형
    tab: 부동산·상권
    keywords:
      - 국토교통부 대책|국토부 대책|부동산 대책
      - 규제지역
      - 토지거래허가
      - 공시가격
      - 취득세
      - 양도세|양도소득세
      - 종부세|종합부동산세
      - 법인 부동산

  region:
    name: 지역개발·토지
    group: 사업형
    tab: 지역개발
    keywords:
      - 산업단지|산단
      - 기업 투자 유치|투자 유치
      - GTX
      - 철도 개발|철도망|신규 노선
      - 신도시
      - 도시재생
      - 개발계획|개발 계획

  rental:
    name: 임대차·주택
    group: 사업형
    tab: 부동산·상권
    keywords:
      - 전세
      - 월세
      - 임대차보호법
      - 전세보증|전세보증금
      - 권리금
      - 아파트 시장|아파트값
      - 빌라 시장|빌라

  auction:
    name: 경매·공매
    group: 사업형
    tab: 부동산·상권
    keywords:
      - 경매|법원경매
      - 공매
      - 낙찰가율

  etc:
    name: 펜션·리모델링·골프
    group: 사업형
    tab: 숙박·관광
    keywords:
      - 펜션
      - 노후 건물|노후 숙박|노후건물
      - 리모델링
      - 골프장
