# ─────────────────────────────────────────────
# 진행 단계 — 개발·투자·교통 기사가 지금 어느 단계인지 표시 (대표님이 수정 가능)
#
#  ※ 2026-10-26 '건의·요구' 단계 추가(가장 아래): 서명운동·건의·촉구·공약 등 — 정부 계획 반영 전
#  words  : 제목·요약에 이 단어가 있으면 그 단계로 판단
#           여러 단계 단어가 함께 있으면 '더 진행된 단계'(아래쪽)를 택합니다.
#           예) "MOU 체결 1년 만에 착공" → 착공
#  points : 집객 점수 가산 (착공·개통 = 실제 수요·교통 흐름이 바뀌는 시점이라 크게)
#  notice : 소재 패킷에 반드시 들어가는 안내 문장
#  cautious: true 면 소재 패킷에서 단정 표현(아래 assertive_words)을 쓰지 않고
#            "~할 계획이다", "~할 수 있다" 식으로 씁니다.
# ─────────────────────────────────────────────

# 개발·투자 (부동산 개발, 대기업·기업 투자, 국가 정책)
development:
  fields: [region, corp, national]
  stages:
    - id: request
      name: 건의·요구
      words: [서명운동, 건의, 촉구, 유치 희망, 유치 염원, 유치 기원, 유치 총력, 유치전, 반드시 반영, 반영 총력, 반영시킬, 공약, 요구, 요청, 결의, 호소, 염원]
      points: 0
      cautious: true
      notice: 아직 정부 계획에 반영되지 않은 지역 요구 단계입니다. 실제 추진 여부와 일정은 정해지지 않았습니다.
    - id: plan
      name: 계획·MOU
      words: [계획, 추진, 검토, 구상, 발표, MOU, 업무협약, 투자협약, 협약 체결, 유치, 협의]
      points: 0
      cautious: true
      notice: 확정된 투자가 아닙니다. 계획·협약 단계로, 실제 투자 규모와 일정은 바뀔 수 있습니다.
    - id: permit
      name: 인허가·예타
      words: [인허가, 허가, 승인, 예타, 예비타당성, 심의 통과, 지정, 고시, 실시계획]
      points: 2
      cautious: true
      notice: 인허가·심사 단계로, 착공 시점과 사업 내용은 바뀔 수 있습니다.
    - id: start
      name: 착공
      words: [착공, 기공식, 첫 삽, 공사 시작, 공사 착수]
      points: 6
      cautious: false
      notice: ""
    - id: done
      name: 준공·개장
      words: [준공, 완공, 개장, 개관, 오픈, 문 열어, 가동 시작, 본격 가동, 입주 시작]
      points: 4
      cautious: false
      notice: ""

# 교통 인프라
transport:
  fields: [transport]
  stages:
    - id: request
      name: 건의·요구
      words: [서명운동, 건의, 촉구, 유치 희망, 유치 염원, 유치 기원, 유치 총력, 유치전, 반드시 반영, 반영 총력, 반영시킬, 공약, 요구, 요청, 결의, 호소, 염원]
      points: 0
      cautious: true
      notice: 아직 정부 계획에 반영되지 않은 지역 요구 단계입니다. 실제 추진 여부와 일정은 정해지지 않았습니다.
    - id: plan
      name: 계획 반영
      words: [계획 반영, 구축계획, 종합계획, 건설계획, 광역교통계획, 반영, 추진, 검토, 노선안]
      points: 0
      cautious: true
      notice: 개통 시기 미정, 계획은 변경될 수 있습니다.
    - id: feasibility
      name: 예타 통과
      words: [예타 통과, 예비타당성 통과, 예타 면제, 예비타당성조사 면제, 타당성 확보]
      points: 2
      cautious: true
      notice: 개통 시기 미정, 계획은 변경될 수 있습니다. 예비타당성 통과는 사업 추진 근거가 생긴 것이지 개통 확정이 아닙니다.
    - id: design
      name: 설계
      words: [설계, 기본계획, 실시설계, 설계 착수, 노선 확정]
      points: 2
      cautious: true
      notice: 설계 단계로, 착공·개통 시기는 바뀔 수 있습니다.
    - id: start
      name: 착공
      words: [착공, 기공식, 첫 삽, 공사 시작, 공사 착수]
      points: 5
      cautious: false
      notice: ""
    - id: open
      name: 개통
      words: [개통, 개항, 취항, 운행 시작, 정차 시작, 개통식, 시범 운행]
      points: 10
      cautious: false
      notice: ""

# 일정 지연·취소 단어 — 있으면 단계 옆에 '일정 변경' 표시, 교통 이슈는 호재 → 양면으로 바꿈
delay_words: [연기, 지연, 무산, 취소, 보류, 백지화, 중단, 제동, 차질, 표류, 어려울, 불투명, 늦어, 미뤄]

# 아직 일어나지 않은 단계 — 단계 단어 바로 뒤(8글자 안)에 이 말이 오면 '예정'으로 봄
# 예) "2028년 개통 예정" → '개통 예정'(가산점 절반), "개통했다" → 개통(+10)
# 2026-10-26 실제 데이터: "연말개통 어려울듯", "조기개통 기원", "2028년 착공 향해" 가 개통·착공으로 잘못 잡혀 추가
future_words: [예정, 목표, 앞둔, 앞두고, 계획, 전망, 추진, 향해, 위해, 예상, 유력, 기원, 촉구, 염원, 기대, 가능, 어려울, 불투명, 건의, 요구, 요청, 시킬, 되도록, 총력]
# 단계 단어 바로 앞(4글자 안)에 오면 '예정'으로 보는 말 — "조기 개통", "적기 개항"
future_prefix_words: [조기, 적기, 조속]
# 계획 문서 이름 — '건의·요구' 표현이 함께 있으면 계획 단계로 세지 않음
# 예) "국가철도망 구축계획에 반드시 반영시킬 것" → 아직 요구 단계
document_words: [구축계획, 종합계획, 건설계획, 광역교통계획, 기본계획]

# 단계 단어 바로 뒤에 오면 단계로 보지 않는 말 — "안동댐 준공 50주년"(옛날 일)
ignore_after_words: [주년]
upcoming_notice: 예정된 일정이며, 실제 시기는 바뀔 수 있습니다.

# 단계 단어가 하나도 없을 때 기본 단계 (안전하게 '계획'으로 보고 신중하게 씀)
default_stage: plan

# 계획·인허가·예타·설계 단계(cautious: true)에서 소재 패킷에 쓰지 않는 단정 표현
assertive_words:
  - 확정
  - 들어선다
  - 생긴다
  - 반드시
  - 무조건
  - 확실
  - 100%
  - 오른다
  - 뜬다

# 위 단정 표현이 들어 있어도 '확인하라'는 뜻이라 괜찮은 말
assertive_allowed:
  - 확정 여부
  - 확정됐는지
  - 확정된 투자가 아닙니다
  - 확정이 아닙니다
  - 확정된 것은 아닙니다
