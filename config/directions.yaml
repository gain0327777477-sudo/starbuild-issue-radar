# ─────────────────────────────────────────────
# 방향 판정 — 환율·금리·증시·예금금리 기사가 오르는 쪽인지 내리는 쪽인지 (대표님이 수정 가능)
#
#  phrases : 먼저 찾는 긴 표현. 찾으면 그 자리를 지워서 아래 words 와 겹치지 않게 합니다.
#            "실효환율~최고" 처럼 ~ 를 넣으면 그 사이에 다른 글자가 12자까지 있어도 찾습니다.
#  words   : 짧은 낱말
#  판정    : 대표 기사 제목은 3배, 같이 묶인 다른 기사 제목(최대 5개)은 1배로 세어서
#            한쪽이 다른 쪽의 1.5배 이상이면 그 방향, 아니면 '불분명' → 중립 문장 + 부드러운 안내(soft)
#
#  ※ 환율의 up = 환율 상승 = 원화 약세. '원화 가치 상승'·'원화 강세'는 환율 하락(down) 입니다.
#  ※ 2026-10-26 실제 기사 제목으로 만든 목록입니다(예: "환율 또 연저점", "명목실효환율 2년 만에 최고",
#    "코스피 5500선 붕괴", "매파적 동결", "인상 전망 후퇴").
# ─────────────────────────────────────────────

topics:
  fx:
    name: 환율
    labels: {up: 원화 약세(환율 상승), down: 원화 강세(환율 하락), unclear: 환율 방향 불분명}
    phrases:
      down: [원화 가치 상승, 원화 가치 오름, 원화 강세, 강원화, 달러 약세, 실효환율~최고, 실효환율~상승, 연중 저점, 연저점, 최저]
      up: [원화 가치 하락, 원화 약세, 달러 강세, 킹달러, 고환율, 연중 고점, 연고점, 최고]
    words:
      up: [상승, 급등, 올라, 오름, 오른, 뛰어, 치솟, 돌파, ↑, 고점]
      down: [하락, 급락, 내려, 내린, 내림, 떨어, 뚝, ↓, 저점]

  rate:
    name: 금리
    labels: {up: 금리 인상·상승, down: 금리 인하·하락, hold: 금리 동결, unclear: 금리 방향 불분명}
    phrases:
      up: [인하 기대 후퇴, 인하 전망 후퇴, 매파, 금리 상승, 금리~상승]
      down: [인상 전망 후퇴, 인상 기대 후퇴, 인하 기대, 피벗, 비둘기, 금리 하락, 금리~하락]
      hold: [동결, 유지]
    words:   # '상승·하락' 낱말만으로는 세지 않음 ('물가 재상승' 같은 다른 이야기와 섞여서) → 위 phrases 의 '금리~상승'으로
      up: [인상, 올려, 올리, 오르, 올라, 긴축]
      down: [인하, 내려, 내리, 낮춰, 완화]

  stock:
    name: 증시
    labels: {up: 증시 상승, down: 증시 하락·변동성, unclear: 증시 방향 불분명}
    phrases:
      down: [반등 무산, 상승 반납, 선 붕괴, 선 내줘, 변동성 확대, 팔자]
      up: [사상 최고, 최고치 경신, 하락 만회, 반등 성공, 사자]
    words:
      up: [상승, 급등, 강세, 랠리, 돌파, 반등, 올라, 오름, 신고가, 최고치]
      down: [하락, 급락, 폭락, 약세, 조정, 출렁, 후퇴, 최저, 붕괴, 무너, 밀려, 와르르, 내려앉, 내줘, 매도세, 변동성, 낙폭, 아래로, 하회]

  deposit:
    name: 예금 금리
    labels: {up: 예금 금리 상승, down: 예금 금리 하락, unclear: 예금 금리 방향 불분명}
    phrases: {}
    words:
      up: [인상, 올리, 올려, 상승, 오르, 올라]
      down: [인하, 내리, 내려, 하락, 낮춰]

# 제목 후보에 붙는 방향 말 — 키워드 뒤에 붙음 (예: "환율 하락(원화 강세), 숙박업 영향은?")
title_suffix:
  fx: {up: 상승(원화 약세), down: 하락(원화 강세)}
  rate: {up: 인상, down: 인하, hold: 동결}
  stock: {up: 상승, down: 하락}
  deposit: {up: 인상, down: 인하}

title_weight: 3        # 대표 기사 제목 가중치
other_titles: 5        # 함께 세는 다른 기사 제목 수
dominance: 1.5         # 한쪽이 다른 쪽의 몇 배 이상이어야 방향으로 볼지
