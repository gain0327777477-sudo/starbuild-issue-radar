# ─────────────────────────────────────────────
# 수집 소스 설정
# enabled: false 로 바꾸면 그 소스는 수집하지 않습니다.
# 한 소스가 실패해도 나머지는 계속 수집하고, 실패 내역은 화면 상단에 표시됩니다.
# ─────────────────────────────────────────────

# 수집 간격(분) — GitHub 자동 실행 주기와 맞춥니다. 예상 호출 수 계산에 사용.
collect_every_minutes: 30

# 1. 네이버 검색 API(뉴스) — 키가 있을 때만 동작 (없으면 자동으로 건너뜀)
naver_news:
  enabled: true
  per_keyword: 20          # 키워드당 가져올 기사 수 (최대 100)
  daily_call_limit: 20000  # 네이버 공식 한도는 하루 25,000회. 여유를 두고 20,000에서 멈춤

# 2. 정책브리핑 보도자료
#    ※ korea.kr RSS는 2026-07-01 서비스 중단(저작권 사유), 공공데이터포털 API도 폐기됨.
#      대신 Google News에서 'site:korea.kr 부처명' 으로 정책브리핑 게시물을 받아옵니다(키 불필요).
#    ※ 정부 조직 개편으로 기획재정부는 재정경제부·기획예산처로 나뉘었습니다(정책브리핑 부처 목록 기준).
korea_briefing:
  enabled: true
  window: 3d               # 최근 며칠 치를 받을지
  departments:
    - 국토교통부
    - 재정경제부
    - 문화체육관광부
    - 행정안전부
    - 중소벤처기업부
    - 금융위원회
    - 국세청

# 3. Google News RSS — 보조용, 국내 언론만(해외 매체는 filters.yaml 로 걸러냄)
google_news:
  enabled: true
  window: 2d
  keywords_per_query: 5    # 분야별 키워드 몇 개를 OR로 묶어 한 번에 검색할지

# 4. 네이버 데이터랩 검색어트렌드 — 키가 있을 때만 동작
#    실제 조회수·실시간 순위가 아니라 '최근 검색 추이가 오르는지(상대 추이)'만 봅니다.
#    하루 한도 1,000회 → 30분마다 부르지 않고, 상위 이슈 키워드만 묶어서 몇 시간 간격으로 부르고 결과를 재사용합니다.
datalab:
  enabled: true
  interval_hours: 3        # 이 시간이 지나야 새로 조회 (그 사이에는 저장된 결과 재사용)
  top_issues: 20           # 상위 몇 개 이슈의 핵심 키워드를 조회할지
  groups_per_call: 5       # 데이터랩 1회 호출에 키워드 묶음 최대 5개(네이버 규칙)
  max_new_calls_per_run: 1 # 3시간 사이에 새로 뜬 상위 이슈만 추가 조회 (30분 실행마다 최대 1회)
  daily_call_limit: 200    # 공식 한도 1,000회와 별도로 스스로 거는 상한

# 5. 내 블로그 RSS — 최근 쓴 글과 주제가 겹치면 경고
blog_rss:
  enabled: true
  url: https://rss.blog.naver.com/yantai7.xml
  duplicate_days: 7
