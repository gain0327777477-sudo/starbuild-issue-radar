# ─────────────────────────────────────────────
# 수집 소스 설정
# enabled: false 로 바꾸면 그 소스는 수집하지 않습니다.
# 한 소스가 실패해도 나머지는 계속 수집하고, 실패 내역은 화면 상단에 표시됩니다.
# ─────────────────────────────────────────────

# 수집 일정 — 한국 시간 정각, 하루 9회 (2026-10-27 변경: 30분마다 → 2시간마다, 밤에는 쉼)
#  ※ GitHub 자동 실행(.github/workflows/collect.yml)의 cron 은 UTC(한국 -9시간)라서 따로 적혀 있습니다.
#    이 목록을 바꾸면 cron 도 같이 바꿔야 합니다 — 설정 검사기가 둘이 어긋나면 알려 줍니다.
schedule_kst_hours: [6, 8, 10, 12, 14, 16, 18, 20, 22]
quiet_hours: {start: 22, end: 7}   # 이 사이(22시~다음날 07시)에는 경고 대신 '야간 휴식 중' 안내
stale_hours: 3                      # 낮에 마지막 수집이 이 시간을 넘으면 빨간 경고

# 1. 네이버 검색 API(뉴스) — 키가 있을 때만 동작 (없으면 자동으로 건너뜀)
naver_news:
  enabled: true
  per_keyword: 50          # 키워드당 가져올 기사 수 (최대 100). 2026-10-27: 20 → 50 (2시간 간격이라 큰 키워드는 20건을 넘음)
  per_keyword_morning: 100 # 밤사이 등 오래 비었을 때 받는 수 (최대치)
  morning_gap_hours: 5     # 직전 네이버 수집에서 이 시간 넘게 지났으면 100건 — 06시 실행(22시 이후 8시간),
                           # 실행이 빠진 뒤, 네이버 첫 수집일 때. (시각이 아니라 '빈 시간'으로만 판단)
  daily_call_limit: 20000  # 네이버 공식 한도는 하루 25,000회. 여유를 두고 20,000에서 멈춤

# 2. 정책브리핑 보도자료 — 30분마다
#    ※ korea.kr RSS는 2026-07-01 서비스 중단(저작권 사유), 공공데이터포털 API도 폐기됨.
#      대신 Google News에서 'site:korea.kr 부처명' 으로 정책브리핑 게시물을 받아옵니다(키 불필요).
#    ※ 이름이 바뀐 부처는 keywords.yaml 의 agencies 에 따라 옛 이름까지 OR 로 묶어 검색합니다.
#      (예: 재정경제부 → site:korea.kr (재정경제부 OR 기획재정부 OR 기재부 OR 재경부))
korea_briefing:
  enabled: true
  window: 3d               # 최근 며칠 치를 받을지
  departments:
    - 국토교통부
    - 재정경제부
    - 기획예산처
    - 산업통상부
    - 문화체육관광부
    - 행정안전부
    - 중소벤처기업부
    - 금융위원회
    - 국세청

# 3. Google News RSS — 보조용. 실행이 2시간 간격이라 매 실행마다 전체 검색어를 한 바퀴 다 돕니다(순환 없음).
#    검색 사이 1.5초 쉬고, 막히면(429/503) 1시간 쉬었다가 다시 시도합니다.
google_news:
  enabled: true
  window: 2d
  keywords_per_query: 5    # 분야별 키워드 몇 개를 OR로 묶어 한 번에 검색할지
  pause_seconds: 1.5       # 검색 사이 쉬는 시간

  # 지자체 보도자료 — 2026-10-26 실제 확인 결과 쓸 만한 곳만 넣었습니다.
  #  확인 결과: 서울·경기·인천·충남·부산·대전은 보도자료가 잡힘(메뉴·채용공고 같은 잡음은 filters.yaml 로 거름)
  #           대구(버스정보만)·울산(메뉴 페이지)·경북(목록 페이지)·충북은 잡음뿐,
  #           광주·세종·강원·전북·전남·경남·제주는 0건 → 이 지역 소식은 일반 뉴스 검색 + 지역 태그로 잡습니다.
  #  사이트마다 아래 topic 단어 중 하나가 들어간 글만 검색합니다.
  local_gov:
    topic: [착공, 개통, 준공, 산업단지, 투자협약, 고속도로, 철도, 개발, 관광]
    sites:
      - { name: 서울시, site: news.seoul.go.kr }
      - { name: 경기도, site: gnews.gg.go.kr }
      - { name: 인천시, site: incheon.go.kr }
      - { name: 충청남도, site: chungnam.go.kr }
      - { name: 부산시, site: busan.go.kr }
      - { name: 대전시, site: daejeon.go.kr }

# 4. 네이버 데이터랩 검색어트렌드 — 키가 있을 때만 동작
#    실제 조회수·실시간 순위가 아니라 '최근 검색 추이가 오르는지(상대 추이)'만 봅니다.
#    하루 한도 1,000회 → 상위 이슈 키워드만 묶어서 조회하고 결과를 재사용합니다.
#    실행이 2시간 간격이라 매 실행마다 새로 조회합니다(interval_hours 1.5 = 직전 조회 후 1.5시간 지났으면 새로).
datalab:
  enabled: true
  interval_hours: 1.5      # 이 시간이 지나야 새로 조회 (그 사이 실행에서는 저장된 결과 재사용)
  top_issues: 20           # 상위 몇 개 이슈의 핵심 키워드를 조회할지
  groups_per_call: 5       # 데이터랩 1회 호출에 키워드 묶음 최대 5개(네이버 규칙)
  max_new_calls_per_run: 1 # 정기 조회가 아닌 실행에서 새로 뜬 상위 이슈만 추가 조회 (최대 1회)
  daily_call_limit: 200    # 공식 한도 1,000회와 별도로 스스로 거는 상한

# 5. 내 블로그 RSS — 최근 쓴 글과 주제가 겹치면 경고
#    주소는 office.yaml 의 blog 에서 자동으로 만듭니다 (blog.naver.com/아이디 → rss.blog.naver.com/아이디.xml)
blog_rss:
  enabled: true
  duplicate_days: 7
