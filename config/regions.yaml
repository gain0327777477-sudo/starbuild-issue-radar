# 아직 통합되지 않은 시·도의 통합 예정 이름 (통합법 국회 계류 중, 2026-10 기준)
# 기사에 이 이름이 나오면 묶인 시·도 모두를 지역으로 표시합니다. 통합되면 위 regions 를 합쳐 주세요.
