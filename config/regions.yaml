# ─────────────────────────────────────────────
# 지역 태그 — 기사 제목·요약에서 시·도 + 시·군·구를 찾아 카드에 표시 (대표님이 수정 가능)
#
#  names : 시·도를 가리키는 말
#  areas : 시·군·구. "청주시|오송|오창" 처럼 | 뒤에 동네·신도시 이름을 붙이면 그 이름으로도 찾습니다.
#          ※ 일반 단어와 겹치는 동네 이름은 넣지 마세요 (예: 성수→성수기, 수지→경상수지, 미사→미사일, 서면→서면 답변)
#          '포항시'는 '포항'으로도 찾습니다(끝의 시·군·구를 떼고 검색).
#
#  ※ 기준: 2026-10 행정구역. 인천은 2026-07-01 개편(제물포구·영종구·검단구) 반영, 옛 이름은 | 뒤에 넣음.
#    전남광주통합특별시: 2026-07-01 출범 → 옛 광주광역시·전라남도를 한 지역으로 묶음(시·군·구 이름은 그대로).
#    시·도 통합 등으로 이름이 바뀌면 names 에 새 이름을 추가하세요.
#  ※ '중구·동구·서구·남구·북구·강서구·고성군'처럼 여러 시·도에 같은 이름이 있으면
#    기사에 시·도 이름이 함께 나올 때만 시·군·구까지 붙입니다(자동 처리).
# ─────────────────────────────────────────────

