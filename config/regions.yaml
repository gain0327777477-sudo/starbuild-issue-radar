  대구경북특별시: [대구, 경북]
  대구경북통합특별시: [대구, 경북]
  충남대전통합특별시: [충남, 대전]

# 관광지 — 환율·외국인 관광객 이슈(fx_tourism 규칙)는 지역 태그가 여기 있을 때만 연결 점수를 더 줍니다.
# 시·도 이름이나 시·군·구 이름(시·군·구를 뗀 짧은 이름도 가능)을 적으세요.
