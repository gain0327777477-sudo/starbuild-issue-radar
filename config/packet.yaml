# 확인할 것 — 카테고리별 기본 항목 (진행 단계·호재/악재 항목이 자동으로 더해짐)
checklist:
  대출 가능·불가 판단: [내 대출이 변동금리인지 고정금리인지, DSR 등 대출 한도 규제 적용 여부, 다음 금리 결정 일정]
  모텔호텔: ["{지역} 모텔·호텔 매물 시세와 거래 흐름", 객실 가동률과 주말·평일 매출 차이, 주변 경쟁 업소 변화]
  숙박업 정보: [최근 예약 추이(주말·연휴), 외국인·내국인 관광객 통계, 숙박 플랫폼 정책 변화]
  상가: [해당 상권 실제 공실 수, 유동 인구 변화, 임대료 시세]
  건물: [실제 임대 수익률, 공실 위험, 대출 조건]
  토지: [토지이용계획(용도지역), 개발 계획 확정 여부, 토지거래허가 대상 여부]
  주택: [전월세 시세 변화, 바뀌는 제도의 시행일, 세금 영향]
  빌라 아파트: [실거래가 흐름, 전세가율, 바뀌는 제도의 시행일]
  리모델링 위탁 운영: [시설 노후 정도와 개보수 범위, 리모델링 후 예상 매출, 위탁 운영 조건]
  건물매매전략 매물 접수: [바뀌는 세금의 시행일, 보유 기간에 따른 세금 차이, 정확한 세액은 세무 전문가 확인]
  펜션: [계절별 매출 차이, 지역 관광객 흐름, 인허가(농어촌민박 등) 기준]
  골프: [골프장 이용객 흐름, 주변 숙박·토지 수요]
  뉴스: [발표 기관의 원문 자료, 시행 시기, 내 상황에 해당되는지]

checklist_by_stage:
  request: [정부 계획에 실제로 반영됐는지, 예산·예타 같은 다음 절차 일정]
  plan: [정해진 계획인지 아직 검토 단계인지, 예산과 일정이 정해졌는지]
  feasibility: [예타 결과 원문, 설계·착공 예정 시기]
  permit: [인허가 완료 여부, 착공 예정 시기]
  design: [설계 완료·착공 예정 시기]
  start: [공사 기간과 투입 인력 규모, 공사 구간 주변 숙박 수요]
  done: [실제 운영(입주·가동) 시작 시점, 주변 유동 인구 변화]
  open: [개통 후 실제 통행량·이용객 변화, 주변 상권·숙박 수요 변화]

checklist_by_polarity:
  악재: [개통·변경 전후 통행량과 매출 변화, 매도와 보유 중 어느 쪽이 유리한지 시세 확인]
  양면: [좋아지는 점과 나빠지는 점을 함께 확인]

# 쉬운 용어 설명 — 기사에 이 말이 나오면 패킷 '쉬운 설명'에 붙습니다
glossary:
  DSR: 연 소득에서 모든 대출의 원리금 상환액이 차지하는 비율. 높을수록 추가 대출이 어렵습니다.
  기준금리: 한국은행이 정하는 기준이 되는 금리. 은행 대출·예금 금리가 이를 따라 움직입니다.
  FOMC: 미국 중앙은행(연준)이 금리를 정하는 회의입니다.
  연준: 미국의 중앙은행입니다. 미국 금리를 정합니다.
  명목실효환율: 여러 나라 통화와 비교한 원화의 평균 가치. 오르면 원화가 강해졌다는 뜻입니다.
  예타: 예비타당성조사. 큰 나랏돈이 드는 사업을 해도 되는지 미리 따져보는 절차입니다.
  예비타당성: 큰 나랏돈이 드는 사업을 해도 되는지 미리 따져보는 절차입니다.
  리츠: 여러 사람의 돈을 모아 부동산에 투자하고 수익을 나눠 주는 회사(상품)입니다.
  공시가격: 정부가 매년 정하는 부동산 가격. 보유세 등 세금 계산의 기준이 됩니다.
  토지거래허가: 정해진 지역에서 일정 면적 이상 땅을 사려면 관청 허가를 받아야 하는 제도입니다.
  기회발전특구: 지방으로 옮기거나 투자하는 기업에 세금·규제 혜택을 주는 지역입니다.
  도시민박업: 도시 주택에서 외국인 관광객에게 숙박을 제공하는 업종입니다.
  농어촌민박: 농어촌 주민이 집을 활용해 숙박을 제공하는 업종입니다.
  낙찰가율: 경매에서 감정가 대비 실제 낙찰된 가격의 비율입니다.
  공실률: 건물에서 비어 있는 면적(호실)의 비율입니다.
  착공: 공사를 시작하는 것입니다.
  준공: 공사를 마치는 것입니다.
  광역철도: 여러 시·도를 잇는 철도입니다.
  복선전철: 오가는 선로가 따로 있는 전기 철도입니다.

# 필수 문구
mandatory:
  investment_fields: [stock, macro, asset]   # 이 분야 글에는 아래 문구가 반드시 들어감
  investment: 이 글은 시장 흐름을 설명하기 위한 것으로 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.

# '원고 작성 요청문'(Claude 앱에 붙여넣는 지시문)의 글쓰기 규칙
writing_style:
  - 첫 문단에 질문에 대한 답을 먼저 2~3문장으로 씁니다.
  - 소제목은 질문형으로 씁니다.
  - "한 글에는 질문 하나만 다룹니다: {질문}"
  - 날짜·수치·출처(언론사)를 본문에 밝힙니다.
  - 전문용어는 처음 나올 때 쉬운 말로 풀어 씁니다.
  - 기사 문장을 그대로 옮기지 말고 내 말로 다시 씁니다. 기사 본문을 길게 인용하지 않습니다.
  - 자료에 없는 수치나 사실은 지어내지 않고, 확인이 필요한 부분은 "확인 필요"라고 표시합니다.
  - 마크다운 기호(#, *, -, > 등) 없이 네이버 블로그 에디터에 바로 붙일 수 있는 일반 텍스트로 씁니다.
  - 분량은 1,500~2,500자로 씁니다.
  - 글 끝에 출처(언론사·날짜)를 적습니다.
writer_role: 전국 모텔·호텔 매매 전문 {short_name} 블로그의 글을 씁니다. 숙박업을 20년간 직접 운영해 온 중개사의 시선으로, 독자에게 차분하게 설명하듯 씁니다.
