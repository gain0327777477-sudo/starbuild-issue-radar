# 블로그 소재 패킷 — 이슈 카드에서 '소재로 저장'하면 만들어지는 글감 묶음 (대표님이 수정 가능)
#  {키워드} {지역} 은 이슈마다 자동으로 채워집니다.
# ─────────────────────────────────────────────

# 제목 후보 — 검색 키워드를 앞에, 30자 안팎, 과장·낚시 금지
title:
  max_chars: 32
  min_chars: 12

# 제목·패킷에 쓰지 않는 과장·낚시 표현 (설정 검사·패킷 검사에서 함께 확인)
hype_words: [충격, 대박, 역대급, 폭등, 필독, 꼭 보세요, 무조건, 지금 당장, 놓치면, 난리, 경악, 알고 보니, 소름, 단독 공개]

# 카테고리별 — view: 글에서 부르는 관점 이름 / question: 사람들이 궁금해하는 질문(검색 의도) / short: 제목 끝 짧은 질문
category_questions:
  대출 가능·불가 판단: {view: 대출을 앞둔 분, question: "{키워드}, 내 대출 한도와 이자는 어떻게 달라질까?", short: 대출 한도 영향은}
  모텔호텔: {view: 모텔·호텔, question: "{키워드}, {지역}모텔·호텔 시장에는 어떤 영향이 있을까?", short: 모텔·호텔 영향은}
  숙박업 정보: {view: 숙박업, question: "{키워드}, 숙박업에는 어떤 영향이 있을까?", short: 숙박업 영향은}
  상가: {view: 상가, question: "{키워드}, {지역}상가 시장에는 어떤 영향이 있을까?", short: 상가 영향은}
  건물: {view: 건물 투자, question: "{키워드}, 건물 투자자는 무엇을 확인해야 할까?", short: 건물 투자 영향은}
  토지: {view: 토지, question: "{키워드}, {지역}토지 시장에는 어떤 영향이 있을까?", short: 토지 영향은}
  주택: {view: 주택, question: "{키워드}, 전월세와 집값에는 어떤 영향이 있을까?", short: 전월세 영향은}
  빌라 아파트: {view: 아파트·빌라, question: "{키워드}, 아파트·빌라 시장에는 어떤 영향이 있을까?", short: 집값 영향은}
  리모델링 위탁 운영: {view: 숙박업소 운영자, question: "{키워드}, 숙박업소는 어떻게 대응해야 할까?", short: 숙박업소 대응은}
  건물매매전략 매물 접수: {view: 건물 매도, question: "{키워드}, 건물 매도 시점은 어떻게 판단할까?", short: 매도 시점 점검}
  펜션: {view: 펜션, question: "{키워드}, 펜션 시장에는 어떤 영향이 있을까?", short: 펜션 영향은}
  골프: {view: 골프장 주변, question: "{키워드}, 골프장 주변 지역에는 어떤 영향이 있을까?", short: 주변 영향은}
  뉴스: {view: 생활, question: "{키워드}, 무엇이 달라질까?", short: 무엇이 달라지나}

