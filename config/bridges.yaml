# ─────────────────────────────────────────────
# 사업 연결 규칙 — 이슈를 내 블로그 카테고리로 잇는 규칙 (대표님이 수정 가능)
#
# 규칙 읽는 법
#  fields     : 이 분야(keywords.yaml의 영문 이름)의 이슈일 때
#  words      : 그리고 제목·요약에 이 단어 중 하나가 있을 때 (비워두면 분야만 맞으면 적용)
#  also_words : (선택) 그리고 이 단어 중 하나도 함께 있을 때
#  stages     : (선택) 이 진행 단계일 때만 적용 — stages.yaml 의 id (예: start=착공, done=준공·개장, open=개통)
#  categories : 연결할 블로그 카테고리 (blog_categories.yaml 의 name 과 똑같이)
#  strength   : 직접 / 간접   (어느 규칙에도 안 걸리면 자동으로 '연결 약함' → 추천 순위에서 내림)
#  polarity   : 호재 / 악재 / 양면 — 교통 인프라 규칙은 반드시 적기
#  logic      : 왜 이어지는지 (화면에 '연결 논리'로 표시)
#  sentence   : 글 중간에 넣을 연결 문장 예시
#               {지역} 은 기사에서 찾은 지역(예: 포항)으로 바뀝니다. 지역을 못 찾으면 '해당 지역'.
#  cta        : 마무리 상담 안내 종류 — loan(대출 상담) / listing(매물 접수·매수 상담) / remodel(리모델링 위탁)
#
# 한 이슈가 여러 규칙에 걸리면 ① 이슈의 주 분야 규칙 ② 더 강한 연결(직접 > 간접) ③ 위에 있는 규칙 순으로 우선합니다.
# 그래서 단계(stages)가 붙은 구체적인 규칙을 위쪽에 둡니다.
# 「추가 제안」 표시 규칙은 요청서에 없던 것을 제가 보탠 것입니다. 필요 없으면 지우세요.
# '원룸형 건물'은 블로그 카테고리에 없어서 '건물' 카테고리로 연결했습니다.
# ─────────────────────────────────────────────

rules:
  # ── 개발·투자 (2026-10-26 요청) ─────────────
  - id: corp_construction
    fields: [corp, region, national]
    words: [공장, 산단, 산업단지, 클러스터, 반도체, 배터리, 이차전지, 2차전지, 데이터센터, 물류센터, 플랜트, 국가산단]
    stages: [start]
    categories: [모텔호텔]
    strength: 직접
    logic: 대규모 공장·산단 공사가 시작되면 공사 인력이 장기간 머물 숙소 수요가 생긴다
    sentence: '{지역}에서 대규모 공사가 시작되면 공사 인력이 몇 달에서 몇 년씩 머물 숙소가 필요해집니다. {지역} 모텔호텔 매매·임대에 관심이 커지는 시점입니다.'
    cta: listing

  - id: corp_completion
    fields: [corp]
    words: [공장, 연구소, R&D, 본사, 데이터센터, 물류센터, 클러스터, 캠퍼스]
    stages: [done]
    categories: [모텔호텔, 상가, 건물]
    strength: 직접
    logic: 공장·연구소가 문을 열면 출장·상주 인구가 늘어 숙박·상가·원룸형 건물 수요로 이어진다
    sentence: '{지역}에 공장·연구소가 가동을 시작하면 출장자와 상주 근무자가 늘어납니다. 숙박시설, 상가, 원룸형 건물 수요가 함께 움직이는지 지켜볼 때입니다.'
    cta: listing

  - id: public_relocation
    fields: [national, corp]
    words: [공공기관 이전, 공공기관 지방 이전, 본사 이전, 연구소 이전, 이전 대상]
    categories: [모텔호텔, 상가, 건물]
    strength: 직접
    logic: 공공기관·본사가 옮겨 오면 출장·상주 인구가 늘어 숙박·상가·원룸형 건물 수요로 이어진다
    sentence: '공공기관이나 본사가 {지역}으로 옮겨 오면 출장과 상주 인구가 늘어납니다. 이전 일정이 확정됐는지부터 확인하고, 주변 숙박시설과 상가·원룸형 건물 흐름을 함께 보는 것이 좋습니다.'
    cta: listing

  - id: mall_opening
    fields: [corp, lodging, region, commercial]
    words: [쇼핑몰, 복합쇼핑몰, 아울렛, 상업시설, 스타필드, 리조트, 테마파크, 관광시설, 워터파크, 전시장]
    stages: [done]
    categories: [상가, 숙박업 정보]
    strength: 직접
    logic: 복합쇼핑몰·관광시설이 문을 열면 방문객이 늘고 주변 상권과 숙박 수요가 달라진다
    sentence: '{지역}에 대형 상업·관광시설이 문을 열면 방문객 동선이 바뀝니다. 주변 상가는 손님이 늘 수도, 대형시설로 빠져나갈 수도 있어 상권 변화를 직접 확인해야 합니다.'
    cta: listing

  - id: redevelopment
    fields: [region, rental]
    words: [재개발, 재건축]
    categories: [주택, 빌라 아파트, 상가]
    strength: 직접
    logic: 재개발·재건축은 이주 수요와 주변 상권 변화를 함께 만든다
    sentence: '{지역} 재개발·재건축이 진행되면 기존 주민의 이주 수요가 생기고 주변 주택·빌라 전월세와 상권이 함께 움직입니다.'
    cta: listing

  # ── 교통 인프라 (2026-10-26 요청 — 호재와 악재 모두) ─────
  - id: transport_construction
    fields: [transport]
    words: []
    stages: [start]
    categories: [모텔호텔]
    strength: 직접
    polarity: 호재
    logic: 대형 교통 공사가 시작되면 공사 인력이 공사 구간 주변에 장기 투숙한다
    sentence: '{지역} 교통 공사가 시작되면 공사 구간 주변 모텔에 장기 투숙 수요가 생깁니다. 공사 기간과 인력 규모를 확인해 보세요.'
    cta: listing

  - id: transport_bypass
    fields: [transport]
    words: [우회도로, 노선 변경, 이설, 우회]
    categories: [숙박업 정보, 모텔호텔]
    strength: 직접
    polarity: 악재
    logic: 우회도로가 열리거나 노선이 바뀌면 기존 도로변 차량이 줄어 도로변 숙박업 매출에 영향을 줄 수 있다
    sentence: '{지역}에 우회도로가 열리면 기존 도로변 차량 흐름이 바뀔 수 있습니다. 도로변 숙박업소라면 개통 전후 통행량과 매출 변화를 먼저 확인하고, 필요하면 매도 시점도 함께 검토해 보세요.'
    cta: listing

  - id: transport_airport
    fields: [transport]
    words: [공항, 취항, 국제선, 크루즈]
    categories: [숙박업 정보, 모텔호텔]
    strength: 직접
    polarity: 호재
    logic: 공항 확장·국제선 취항은 외국인 관광객을 늘려 호텔 등 숙박 수요로 이어진다
    sentence: '{지역} 공항에 새 노선이 생기면 외국인 관광객 동선이 달라집니다. 공항 접근성이 좋은 호텔·숙박시설의 수요 변화를 눈여겨볼 만합니다.'
    cta: listing

  - id: transport_access
    fields: [transport]
    words: [IC, 나들목, 고속도로, 신설역, 역 신설, 신규 역, KTX, SRT, 정차]
    categories: [모텔호텔, 토지]
    strength: 직접
    polarity: 호재
    logic: IC 신설·고속도로 개통·신설역은 접근성을 높여 주변 숙박시설과 토지 가치에 영향을 준다
    sentence: '{지역} 접근성이 좋아지면 주변 모텔호텔과 토지를 보는 눈이 달라집니다. 매수를 검토한다면 개통 시기와 실제 동선부터 확인하세요.'
    cta: listing

  - id: transport_rail
    fields: [transport]
    words: [지하철, 광역철도, 경전철, 트램, 연장, 복선전철, GTX]
    categories: [상가, 건물]
    strength: 직접
    polarity: 호재
    logic: 지하철·광역철도 연장은 새 역세권 상권을 만들어 상가·건물·원룸형 건물 수요로 이어진다
    sentence: '{지역}에 새 역이 생기면 역 주변으로 유동 인구가 모이며 상권이 새로 만들어집니다. 역세권 상가와 원룸형 건물의 임대 수요를 함께 살펴볼 때입니다.'
    cta: listing

  - id: transport_general  # 추가 제안: 위 교통 규칙에 안 걸린 교통 이슈(계획 문서 등)도 '연결 약함'이 되지 않도록
    fields: [transport]
    words: []
    categories: [토지, 모텔호텔]
    strength: 간접
    polarity: 양면
    logic: 교통망 계획은 장기적으로 지역 접근성과 토지·숙박 수요를 바꾼다
    sentence: '교통망 계획은 {지역}의 장기적인 접근성을 바꿉니다. 다만 계획 단계에서는 일정과 노선이 바뀔 수 있어, 확정 여부부터 확인하는 것이 먼저입니다.'
    cta: listing

  # ── 기존 규칙 ─────────────────────────────
  # ── 방향이 있는 규칙 (directions.yaml 로 오름·내림 판정 → 방향별 문장) ──
  #  direction.topic    : directions.yaml 의 주제 (fx 환율 / rate 금리 / stock 증시 / deposit 예금 금리)
  #  direction.applies_if: (선택) 제목에 이 말이 있을 때만 방향 판정 (없으면 위의 기본 문장 사용)
  #  up / down / hold   : 방향별 logic·sentence (categories·cta·tourist_bonus 도 바꿀 수 있음)
  #  unclear            : 방향 불분명 → 중립 문장 + cta soft
  - id: rate_loan
    fields: [rate]
    words: []
    categories: [대출 가능·불가 판단]
    strength: 직접
    logic: 금리·대출 규제가 바뀌면 대출 한도와 이자 부담이 바로 달라진다
    sentence: 금리와 대출 규제가 바뀌는 시기에는 '얼마까지 빌릴 수 있는지'부터 다시 확인해야 합니다. 같은 건물이라도 사업자 조건에 따라 대출 한도가 크게 달라집니다.
    cta: loan
    direction:
      topic: rate
      applies_if: [금리]
      up:
        logic: 금리가 오르면 이자 부담이 커지고 매수 판단이 신중해진다
        sentence: 금리가 오르는 시기에는 같은 금액을 빌려도 매달 내는 이자가 늘어납니다. 매수를 검토 중이라면 대출 한도와 이자 부담을 지금 금리 기준으로 다시 계산해 보세요.
      down:
        logic: 금리가 내리면 대출 여건이 나아지고 수익형 부동산에 관심이 커진다
        sentence: 금리가 내려가면 이자 부담이 줄면서 월세가 나오는 수익형 부동산을 다시 보는 분들이 늘어납니다. 다만 대출 한도는 금리와 별개로 DSR 같은 규제의 영향을 받으니 함께 확인해야 합니다.
      hold:
        logic: 금리가 동결되면 당분간 대출 이자 여건이 유지된다
        sentence: 기준금리가 동결되면 당분간 대출 이자 여건은 크게 바뀌지 않습니다. 다음 금리 결정 전에 내 대출 조건과 한도를 미리 점검해 두면 좋습니다.
      unclear:
        logic: 금리 흐름은 대출 이자와 한도 판단의 기준이 된다
        sentence: 금리 소식이 나올 때마다 내 대출 조건이 어떻게 달라지는지 궁금해하시는 분이 많습니다. 금리 방향과 함께 대출 한도 규제도 같이 살펴봐야 합니다.

  - id: stock_market
    fields: [stock]
    words: []
    categories: [건물, 상가, 모텔호텔]
    strength: 간접
    logic: 증시 흐름은 실물자산·수익형 부동산에 대한 관심과 함께 움직인다
    sentence: 주식시장 흐름이 바뀔 때마다 수익형 부동산을 함께 비교해 보는 분들이 있습니다.
    cta: listing
    direction:
      topic: stock
      down:
        logic: 증시가 흔들릴수록 매달 현금이 들어오는 실물자산·수익형 부동산에 관심이 커진다
        sentence: 주식시장이 출렁일 때마다 '가격이 매일 바뀌지 않고 월세가 들어오는 자산'을 찾는 문의가 늘어납니다. 수익형 건물과 숙박시설이 대표적입니다.
      up:
        categories: [건물, 모텔호텔]
        logic: 증시 상승기에 생긴 차익을 수익형 부동산으로 옮기려는 수요가 생긴다
        sentence: 주식으로 수익을 본 뒤 일부를 월 수익이 나오는 건물이나 숙박시설로 옮기려는 분들이 있습니다. 갈아타기 전에는 수익률과 대출 조건을 함께 따져봐야 합니다.
      unclear:
        logic: 증시 흐름은 실물자산·수익형 부동산에 대한 관심과 함께 움직인다
        sentence: 주식시장 흐름이 바뀔 때마다 수익형 부동산을 함께 비교해 보는 분들이 있습니다. 주식과 부동산은 수익 구조가 달라서 비교할 때 보는 기준도 다릅니다.

  - id: reits_construction
    fields: [stock]
    words: [리츠, REITs, 건설주, 건설사]
    categories: [건물, 상가]
    strength: 간접
    logic: 리츠·건설주 흐름은 상업용 부동산 시장 분위기를 그대로 보여준다
    sentence: 리츠와 건설주 흐름은 상업용 부동산 시장의 온도계입니다. 직접 건물을 보유하는 것과 무엇이 다른지 비교해 보겠습니다.
    cta: listing

  - id: lodging_regulation  # 2026-10-26 요청
    fields: [lodging, etc]
    words: [공유숙박, 에어비앤비, 도시민박, 농어촌민박, 숙박업 규제, 숙박 규제, 소방, 위생 기준, 위생, 규제]
    categories: [숙박업 정보, 모텔호텔]
    strength: 직접
    logic: 공유숙박·규제 변화는 기존 모텔·호텔의 경쟁 구도와 운영 비용을 바꾼다
    sentence: '공유숙박과 숙박업 규제가 바뀌면 기존 모텔·호텔의 경쟁 상대와 운영 비용이 함께 달라집니다. {지역} 숙박업소라면 우리 업소에 적용되는 기준부터 확인해 보세요.'
    cta: listing
    cta_if_words:            # 시설 기준 이야기면 리모델링 위탁 상담으로
      remodel: [소방, 위생, 시설 기준, 기준 강화, 개보수]

  - id: platform_fee  # 2026-10-26 요청
    fields: [lodging]
    words: [야놀자, 여기어때, 숙박 플랫폼, 숙박앱, 플랫폼 수수료, 수수료]
    categories: [숙박업 정보, 리모델링 위탁 운영]
    strength: 직접
