#  ※ 연락처·주소는 여기 쓰지 말고 office.yaml 에만 입력하세요(아래 office_footer 가 자동으로 붙임).
#  ※ {short_name} 은 office.yaml 의 short_name(스타빌드)으로 바뀝니다.
cta_templates:
  loan: |-
    지금 내 조건으로 대출을 받을 수 있을지, 한도가 어느 정도일지 궁금하시면 편하게 문의 주세요. 매물과 사업자 상황을 함께 보고 대출 진행 전에 확인해야 할 점을 먼저 짚어 드립니다. 최종 대출 여부와 한도는 금융기관 심사에 따라 결정됩니다.
  listing: |-
    전국 모텔·호텔 매매 전문 {short_name}입니다. 모텔·호텔·건물·상가 매수나 매도를 고민 중이시면 문의 주세요. 매도하실 물건은 매물 접수를, 매수하실 분은 원하시는 지역과 가격대를 알려주시면 맞는 물건을 찾아 드립니다.
  remodel: |-
    시설이 낡아 매출이 줄었거나 직접 운영이 어려우시면 리모델링과 위탁 운영 상담을 받아 보세요. 숙박업을 20년간 직접 운영해 온 경험을 바탕으로, 리모델링팀 '짓고'가 시설과 운영 상태를 함께 진단해 드립니다.
  soft: |-
    이런 경제 흐름이 내 건물이나 숙박업에는 어떤 영향을 줄지 궁금하시면 편하게 물어보세요. 현장 경험을 바탕으로 함께 짚어 드립니다.

# 집객형 분야(증시·주식·거시경제·자산 흐름)는 부드러운 안내(soft)가 기본입니다.
# 연결 강도가 '직접'인 규칙에 걸렸을 때만 그 규칙의 cta(loan/listing)를 씁니다.
soft_cta_fields: [stock, macro, asset]

# 상담 안내 밑에 붙는 사무소 정보 줄 — {중괄호}는 office.yaml 값으로 자동 채워집니다
# (값이 비어 있는 줄은 자동으로 빠짐. 여기에 실제 번호·주소를 직접 쓰지 마세요)
office_footer: |-
  {name} | 대표 {representative}
  중개사무소 등록번호 {registration_no}
  소재지 {address}
  전화 {phone} / 휴대폰 {mobile}
  카카오톡 {kakao}
