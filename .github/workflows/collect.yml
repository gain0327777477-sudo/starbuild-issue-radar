# ─────────────────────────────────────────────
# 30분마다 수집 → data 브랜치에 덮어쓰기 → 화면과 합쳐 GitHub Pages(HTTPS)에 배포
#
#  · 한 번의 실행 안에서 모두 처리합니다. (자동 실행이 만든 커밋은 다른 자동 실행을 깨우지 못해서)
#  · data 브랜치는 매번 '커밋 1개'로 덮어써서 저장소가 커지지 않습니다.
#  · main 에 코드를 올리면(push) 수집 없이 테스트 → 화면만 다시 배포합니다.
#  · 60일 자동 중지 대비: 매 실행 끝에 이 워크플로를 '켜기(enable)' 호출 (README '수집이 멈췄을 때' 참고)
#  · 키는 GitHub Secrets 에만 둡니다. 로그에 찍히지 않습니다.
# ─────────────────────────────────────────────
name: 수집·배포

on:
  schedule:
    - cron: "*/30 * * * *"        # 30분마다 (GitHub 사정으로 5~20분 늦게 시작하는 일이 흔함)
  workflow_dispatch: {}            # Actions 탭에서 'Run workflow' 로 바로 실행
  push:
    branches: [main]

permissions:
  contents: write      # data 브랜치 덮어쓰기
  pages: write         # GitHub Pages 배포
  id-token: write      # GitHub Pages 배포
  actions: write       # 60일 자동 중지 대비 '켜기' 호출

concurrency:
  group: collect-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 프로그램 설치
        run: pip install -r requirements.txt

      - name: 이전 수집 결과 불러오기 (data 브랜치)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
            echo "이전 결과 $(ls data | wc -l)개 파일을 불러왔습니다"
          else
            echo "data 브랜치가 아직 없습니다 (첫 실행)"
          fi

      - name: 테스트 (코드를 올렸을 때만)
        if: github.event_name == 'push'
        run: python -m pytest -q

      - name: 수집·점수·소재 패킷
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true           # 모든 소스가 실패해도 화면에는 실패 내역을 보여주도록 배포는 계속
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          RADAR_RUN_EVENT: ${{ github.event_name }}
          RADAR_RUN_ID: ${{ github.run_id }}
        run: python -m collector.main

      - name: 수집 결과를 data 브랜치에 덮어쓰기
        if: github.event_name != 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "수집 결과 $(date '+%Y-%m-%d %H:%M') (실행 ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" data
          echo "data 브랜치를 덮어썼습니다"

      - name: 화면 + 데이터 묶기
        run: python tools/build_site.py --version "${GITHUB_SHA::7}-${{ github.run_id }}"

      - name: Pages 준비
        uses: actions/configure-pages@v5

      - name: Pages 에 올리기
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: 배포
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 60일 자동 중지 대비 (워크플로 켜기)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml --repo "${{ github.repository }}" && echo "워크플로 켜짐 확인"

      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::모든 수집 소스가 실패했습니다. 화면의 '수집 상태'에서 원인을 확인하세요."
          exit 1
